<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Each person runs a toli daemon. Their agents and the toli TUI or CLI connect to it, and daemons talk to each other over A2A."><style>
