name: Windows Codex wake (temporary)
on:
  push:
    branches: [windows-codex-e2e]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Codex, build toli
        shell: pwsh
        run: |
          npm install -g @openai/codex
          codex --version
          New-Item -ItemType Directory -Force "$HOME\bin" | Out-Null
          go build -o "$HOME\bin\toli.exe" ./cmd/toli
          "$HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Log Codex in
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: $env:OPENAI_API_KEY | codex login --with-api-key
      - name: Install the toli daemon as a scheduled task
        shell: pwsh
        run: |
          toli version
          toli daemon install
          for ($i = 0; $i -lt 30; $i++) { if ((toli daemon status) -match "running\s+yes") { break }; Start-Sleep 1 }
          toli daemon status
          $x = schtasks /Query /TN toli /XML; ($x -join "`n") -match "--path" | Out-String
      - name: Wake test, as a normal (non-admin) user
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          toli daemon uninstall
          $dir = "C:\e2e"
          New-Item -ItemType Directory -Force $dir | Out-Null
          icacls $dir /grant "Everyone:(OI)(CI)F" | Out-Null
          Copy-Item "$HOME\bin\toli.exe" "$dir\toli.exe"
          go build -o "$dir\driver.exe" ./.github/codexe2e
          Set-Content "$dir\key" $env:OPENAI_API_KEY -NoNewline
          $script = @"
          `$ErrorActionPreference = 'Continue'
          `$env:PATH = '$dir;' + '$($env:PATH)'
          Get-Content '$dir\key' | codex login --with-api-key *> '$dir\login.txt'
          Remove-Item '$dir\key'
          Start-Process toli -ArgumentList 'daemon','--log-file','$dir\daemon.log' -WindowStyle Hidden
          for (`$i = 0; `$i -lt 30; `$i++) { if ((toli daemon status) -match 'running\s+yes') { break }; Start-Sleep 1 }
          & '$dir\driver.exe' *> '$dir\out.txt'
          Set-Content '$dir\exit.txt' `$LASTEXITCODE
          "@
          Set-Content "$dir\run.ps1" $script
          $pass = "T0li-" + [Guid]::NewGuid().ToString("N").Substring(0, 16) + "!"
          net user tolitest $pass /add /Y
          if ($LASTEXITCODE -ne 0) { throw "net user failed" }
          $cred = New-Object System.Management.Automation.PSCredential("tolitest", (ConvertTo-SecureString $pass -AsPlainText -Force))
          $p = Start-Process pwsh -Credential $cred -LoadUserProfile -ArgumentList "-NoProfile","-File","$dir\run.ps1" -Wait -PassThru -WorkingDirectory $dir
          "runner exit: $($p.ExitCode)"
          Get-Content "$dir\login.txt" -ErrorAction SilentlyContinue
          Get-Content "$dir\out.txt" -ErrorAction SilentlyContinue
          $code = Get-Content "$dir\exit.txt" -ErrorAction SilentlyContinue
          "driver exit: $code"
          if ($code -ne "0") { exit 1 }
      - name: toli daemon log
        if: always()
        shell: pwsh
        run: Get-Content "C:\e2e\daemon.log" -Tail 80 -ErrorAction SilentlyContinue
